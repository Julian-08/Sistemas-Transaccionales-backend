spring.application.name=zimbra

server.port=8081
server.tomcat.max-threads=32
server.servlet.contextPath=/zimbra/v1

#Conexion BD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/crm_zimbra?zeroDateTimeBehavior=convertToNull&serverTimezone=America/Bogota&useSSL=false&zeroDateTimeBehavior=round
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
#Incluye errores dentro de las respuestas http
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

#Seguridad: JWT. En produccion el secreto es obligatorio (variable de entorno JWT_SECRET, minimo 32 caracteres).
zimbra.jwt.secret=${JWT_SECRET}
zimbra.jwt.minutos-inactividad=15

#Recuperacion de contrasena (RF-003)
zimbra.recuperacion.minutos-vigencia=15
zimbra.recuperacion.codigo-visible-en-bd=false
zimbra.recuperacion.url-frontend=${FRONTEND_URL:http://localhost:4200}/#/restablecer-contrasena

#Correo
zimbra.correo.habilitado=true
zimbra.correo.remitente=${MAIL_USERNAME}
zimbra.frontend.url=${FRONTEND_URL:http://localhost:4200}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

zimbra.cors.origenes=${FRONTEND_URL:http://localhost:4200}
