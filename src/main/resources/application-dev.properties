spring.application.name=zimbra

server.port=8081
server.tomcat.max-threads=32
server.servlet.contextPath=/zimbra/v1

#Conexion BD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/crm_zimbra?zeroDateTimeBehavior=convertToNull&serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=round
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

#Incluye errores dentro de las respuestas http
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false
#Seguridad: JWT (RF-001, RNF-002, RNF-003)
#En desarrollo se usa un secreto de prueba; en produccion se define la variable de entorno JWT_SECRET.
zimbra.jwt.secret=${JWT_SECRET:zimbra-dev-secreto-solo-para-pruebas-locales-cambiar-en-produccion-2026}
#Minutos de inactividad antes de cerrar la sesion (RNF-003, valor ajustable)
zimbra.jwt.minutos-inactividad=15

#Recuperacion de contrasena (RF-003)
zimbra.recuperacion.minutos-vigencia=15
#Desarrollo: el codigo de recuperacion se guarda legible en usuarios.token_recuperacion_hash para
#consultarlo en MySQL sin correo. En produccion debe ser false (se guarda su hash SHA-256).
zimbra.recuperacion.codigo-visible-en-bd=true
zimbra.recuperacion.url-frontend=http://localhost:4200/#/restablecer-contrasena

zimbra.frontend.url=http://localhost:4200

#Correo (Gmail). Apagado por defecto: el codigo de recuperacion se consulta en la base y en la consola.
#Para enviar correos de verdad copie correo-local.properties.example como correo-local.properties
#(en la carpeta del backend), ponga su cuenta y contrasena de aplicacion, y reinicie.
#Ese archivo no se sube al repositorio.
spring.config.import=optional:file:./correo-local.properties
zimbra.correo.habilitado=false
zimbra.correo.remitente=
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

#Origenes permitidos para el frontend (CORS)
zimbra.cors.origenes=http://localhost:4200,http://localhost:3000,http://localhost:5173
